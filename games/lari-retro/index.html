<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f1ff"><title>Lari Retro</title><link rel="stylesheet" href="../../css/game.css"><script src="../../js/game-theme.js"></script><style>
body{display:block;padding:14px;font:16px/1.5 system-ui,sans-serif}main{max-width:680px;margin:auto;text-align:left}h1{font-size:clamp(1.7rem,7vw,2.3rem)}.intro{margin:4px 0 12px;color:var(--muted)}.panel{padding:16px;border:2px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:4px 4px 0 var(--line)}.stats{display:flex;justify-content:space-between;margin:0 0 8px;font-weight:800}.arena{display:block;width:100%;height:auto;border:2px solid var(--line);border-radius:12px;background:#182338;touch-action:manipulation}.status{min-height:2.5em;text-align:center;font-weight:700}.actions{display:flex;justify-content:center;gap:10px}.actions .g-btn{min-width:135px;min-height:50px}.help{margin:12px 0 0;text-align:center;color:var(--muted);font-size:.9rem}@media(max-width:390px){body{padding:9px}.panel{padding:10px}.actions{display:grid;grid-template-columns:1fr 1fr}.actions .g-btn{min-width:0}}
</style></head><body><main><h1>Lari Retro</h1><p class="intro">Lompat melewati rintangan dan kejar jarak terjauh. Hati-hati, larinya makin cepat!</p><section class="panel" aria-label="Permainan Lari Retro"><p class="stats"><span>Jarak: <b id="score">0</b></span><span>Rekor: <b id="best">0</b></span></p><canvas id="arena" class="arena" width="640" height="260" aria-label="Arena lari dan rintangan"></canvas><p id="status" class="status" role="status" aria-live="polite">Tekan Mulai, lalu lompat melewati rintangan.</p><div class="actions"><button id="start" class="g-btn" type="button">Mulai</button><button id="jump" class="g-btn" type="button">Lompat</button></div><p class="help">Spasi / ↑ untuk lompat. Di ponsel, ketuk tombol Lompat atau arena.</p></section></main><script src="../../js/game-storage.js"></script><script src="../../js/game-loader.js"></script></body></html>
