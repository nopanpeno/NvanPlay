<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f1ff"><title>Mini Golf</title><link rel="stylesheet" href="../../css/game.css"><script src="../../js/game-theme.js"></script><style>
body{display:block;padding:14px;font:16px/1.5 system-ui,sans-serif}main{max-width:700px;margin:auto;text-align:left}h1{font-size:clamp(1.7rem,7vw,2.3rem)}.intro{margin:4px 0 12px;color:var(--muted)}.panel{padding:15px;border:2px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:4px 4px 0 var(--line)}.stats{display:flex;justify-content:space-between;gap:8px;margin:0 0 8px;font-weight:800}.arena{display:block;width:100%;height:auto;border:2px solid var(--line);border-radius:12px;touch-action:none;background:#54ad60}.status{min-height:3em;margin:10px 0;text-align:center;font-weight:700}.actions{display:flex;justify-content:center;gap:10px}.actions .g-btn{min-height:48px;min-width:150px}.actions [hidden]{display:none}.help{margin:12px 0 0;color:var(--muted);text-align:center;font-size:.88rem}@media(max-width:390px){body{padding:9px}.panel{padding:9px}.actions{display:grid;grid-template-columns:1fr 1fr}.actions .g-btn{min-width:0}}
</style></head><body><main><h1>Mini Golf</h1><p class="intro">Tiga hole, beberapa bumper, dan satu bola. Selesaikan dengan pukulan sesedikit mungkin.</p><section class="panel" aria-label="Permainan Mini Golf"><p class="stats"><span>Hole <b id="hole">1/3</b> · Pukulan: <b id="strokes">0</b></span><span>Total: <b id="total">0</b> · Rekor: <b id="best">—</b></span></p><canvas id="arena" class="arena" width="600" height="380" aria-label="Lapangan mini golf"></canvas><p id="status" class="status" role="status" aria-live="polite">Tarik dari bola ke belakang, lalu lepaskan untuk memukul.</p><div class="actions"><button id="next" class="g-btn" type="button" hidden>Hole berikutnya</button><button id="restart" class="g-btn" type="button">Mulai ulang</button></div><p class="help">Tarik dengan jari atau mouse. Di komputer, panah untuk membidik dan Spasi untuk memukul.</p></section></main><script src="../../js/game-storage.js"></script><script src="../../js/game-loader.js"></script></body></html>
