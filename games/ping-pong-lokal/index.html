<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f1ff"><title>Ping Pong Lokal</title><link rel="stylesheet" href="../../css/game.css"><script src="../../js/game-theme.js"></script><style>
body{display:block;padding:16px;font:16px/1.5 system-ui,sans-serif}main{max-width:680px;margin:auto;text-align:left}h1{font-size:clamp(1.7rem,7vw,2.3rem)}.intro{color:var(--muted);margin:4px 0 16px}.panel{padding:16px;border:2px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:4px 4px 0 var(--line)}.score{display:flex;justify-content:space-between;margin:0 0 10px;font-size:1.2rem;font-weight:850}.arena{display:block;width:100%;height:auto;border:2px solid var(--line);border-radius:12px;background:#101525;touch-action:none}.status{text-align:center;min-height:2.5em;font-weight:700}.actions{display:flex;justify-content:center;gap:10px}.actions .g-btn{min-height:48px;min-width:130px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.player{display:grid;grid-template-columns:1fr 1fr;gap:8px}.player h2{grid-column:1/-1;margin:0;font-size:.95rem;text-align:center}.hold{min-height:52px;border:2px solid var(--line);border-radius:12px;background:var(--hover);color:var(--fg);font:inherit;font-weight:800;touch-action:none;user-select:none}.help{color:var(--muted);font-size:.9rem;margin:12px 0 0;text-align:center}@media(max-width:400px){body{padding:10px}.panel{padding:11px}.controls{gap:7px}.hold{font-size:.88rem;min-height:48px}}
</style></head><body><main><h1>Ping Pong Lokal</h1><p class="intro">Adu refleks berdua di satu layar. Pemain pertama yang mencetak 5 poin menang.</p><section class="panel" aria-label="Permainan Ping Pong"><p class="score"><span>Pemain 1: <b id="left-score">0</b></span><span>Pemain 2: <b id="right-score">0</b></span></p><canvas id="arena" class="arena" width="640" height="360" aria-label="Lapangan Ping Pong"></canvas><p id="status" class="status" role="status" aria-live="polite">Tekan Mulai untuk bermain.</p><div class="actions"><button id="start" class="g-btn" type="button">Mulai</button><button id="reset" class="g-btn" type="button">Atur ulang</button></div><div class="controls"><div class="player"><h2>Pemain 1 · W / S</h2><button class="hold" data-player="left" data-dir="-1" aria-label="Pemain 1 ke atas">▲</button><button class="hold" data-player="left" data-dir="1" aria-label="Pemain 1 ke bawah">▼</button></div><div class="player"><h2>Pemain 2 · ↑ / ↓</h2><button class="hold" data-player="right" data-dir="-1" aria-label="Pemain 2 ke atas">▲</button><button class="hold" data-player="right" data-dir="1" aria-label="Pemain 2 ke bawah">▼</button></div></div><p class="help">Di komputer: P1 pakai W/S, P2 pakai tombol panah. Di ponsel, tahan tombol pemain.</p></section></main><script src="../../js/game-loader.js"></script></body></html>
