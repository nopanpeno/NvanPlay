<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XO</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, sans-serif; background: #fafaf7; color: #1c1c1a;
    }
    main { width: 100%; max-width: 360px; padding: 16px; text-align: center; }
    h1 { margin: 0 0 4px; font-size: 1.4rem; }
    #info { display: flex; justify-content: space-between; margin: 8px 0; color: #55554f; }
    #board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .cell {
      aspect-ratio: 1; padding: 0; border: 3px solid #1c1c1a; border-radius: 12px;
      background: #fff; font: inherit; font-size: 3rem; font-weight: bold; line-height: 1;
      cursor: pointer; touch-action: manipulation;
    }
    .cell:disabled { cursor: default; }
    .cell[data-mark="X"] { color: #1a56c8; }
    .cell[data-mark="O"] { color: #b3261e; }
    .cell.win { background: #fff3c4; }
    #msg { min-height: 1.6em; margin: 12px 0 0; font-size: 1.1rem; font-weight: bold; }
    #again {
      margin-top: 8px; font-size: 1rem; padding: 12px 20px; border: 0; border-radius: 8px;
      background: #1c1c1a; color: #fff; cursor: pointer;
    }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>XO</h1>
    <p>Kamu X, komputer O. Buat tiga tanda segaris.</p>
    <div id="info"><span id="streak">Beruntun: 0</span><span id="best"></span></div>
    <div id="board" role="group" aria-label="Papan XO"></div>
    <p id="msg" aria-live="polite">Giliranmu.</p>
    <button id="again" type="button" hidden>Main lagi</button>
  </main>
  <script src="../../js/game-storage.js"></script>
  <script src="../../js/game-loader.js"></script>
</body>
</html>
