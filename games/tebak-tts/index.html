<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tebak TTS</title>
  <link rel="stylesheet" href="../../css/game.css">
  <script src="../../js/game-theme.js"></script>
  <style>
    main { max-width: 520px; }
    .stats { display: flex; justify-content: space-between; margin: 8px 0; font-weight: 700; color: var(--muted); }
    #grid { display: grid; gap: 2px; padding: 4px; border: 3px solid var(--line); border-radius: 10px; background: var(--line); user-select: none; -webkit-user-select: none; }
    .cell { position: relative; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: var(--surface); color: var(--fg); font-weight: 800; font-size: clamp(1rem, 4.5vw, 1.4rem); cursor: pointer; }
    .cell.blank { background: var(--line); cursor: default; }
    .cell .num { position: absolute; top: 1px; left: 3px; font-size: .55rem; color: var(--muted); }
    .cell.active { background: #fde68a; }
    .cell.current { background: #fbbf24; }
    .cell.ok { color: #15803d; }
    .cell.bad { color: #b91c1c; }
    .clues { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; font-size: .9rem; }
    .clues h2 { font-size: 1rem; margin: 0 0 4px; }
    .clues ol { list-style: none; margin: 0; padding: 0; }
    .clues li button { all: unset; display: block; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
    .clues li button:focus-visible { outline: 3px solid var(--accent); }
    .clues li.on button { background: #fde68a; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    #status { min-height: 1.6em; margin: 12px 0 0; font-weight: bold; }
    #best { color: var(--muted); }
    .kbd { position: fixed; left: -9999px; top: 0; opacity: 0; width: 1px; height: 1px; }
  </style>
</head>
<body>
  <main>
    <h1>Tebak TTS</h1>
    <p>Isi kotak dengan huruf. Klik kotak untuk pilih, klik lagi untuk ganti arah.</p>
    <div class="stats"><span id="progress">Puzzle 1</span><span>Selesai: <span id="solved">0</span></span></div>
    <div id="grid" aria-label="Papan TTS"></div>
    <div class="clues">
      <div><h2>Mendatar</h2><ol id="across"></ol></div>
      <div><h2>Menurun</h2><ol id="down"></ol></div>
    </div>
    <div class="actions">
      <button id="check" class="g-btn" type="button">Cek</button>
      <button id="next" class="g-btn" type="button" hidden>Puzzle berikutnya</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="best">Rekor terbaik: 0</p>
    <input id="kbd" class="kbd" type="text" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Ketik huruf">
  </main>
  <script src="../../js/data/tebak-tts.js"></script>
  <script src="../../js/game-storage.js"></script>
  <script src="../../js/game-loader.js"></script>
</body>
</html>
