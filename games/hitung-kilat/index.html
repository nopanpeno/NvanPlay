<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hitung Kilat</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #fffaf0; color: #20203a; }
    main { width: 100%; max-width: 380px; padding: 18px; text-align: center; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    #info { display: flex; justify-content: space-between; margin: 14px 0; font-size: 1.1rem; font-weight: 700; }
    #question { display: grid; place-items: center; min-height: 120px; margin: 12px 0; padding: 16px; border: 3px solid #20203a; border-radius: 16px; background: #ffd23f; font-size: 2.5rem; font-weight: 800; }
    #choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    #choices button { min-height: 58px; border: 2px solid #20203a; border-radius: 12px; background: #fff; color: #20203a; font: inherit; font-size: 1.25rem; font-weight: 700; cursor: pointer; touch-action: manipulation; }
    #choices button:hover:not(:disabled) { background: #e9eaff; }
    #choices button:disabled { opacity: .6; cursor: default; }
    #msg { min-height: 1.6em; margin: 12px 0 0; }
    #best { min-height: 1.4em; color: #555; }
    #start { margin-top: 8px; padding: 12px 22px; border: 2px solid #20203a; border-radius: 10px; background: #2d45d6; color: white; font: inherit; font-weight: 700; cursor: pointer; touch-action: manipulation; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Hitung Kilat</h1>
    <p>Jawab soal sebanyak mungkin dalam 30 detik.</p>
    <div id="info"><span id="time">Waktu: 30</span><span id="score">Skor: 0</span></div>
    <div id="question" aria-live="polite">Siap?</div>
    <div id="choices" role="group" aria-label="Pilihan jawaban"></div>
    <p id="msg" aria-live="polite"></p>
    <p id="best"></p>
    <button id="start" type="button">Mulai</button>
  </main>
  <script src="../../js/game-storage.js"></script>
  <script src="../../js/game-loader.js"></script>
</body>
</html>
