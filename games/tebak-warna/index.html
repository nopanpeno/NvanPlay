<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tebak Warna</title>
  <link rel="stylesheet" href="../../css/game.css">
  <script src="../../js/game-theme.js"></script>
  <style>
    #info { display: flex; justify-content: space-between; margin: 12px 0; font-size: 1.1rem; }
    #word { display: grid; place-items: center; height: 120px; margin-bottom: 12px; background: #222; border: 2px solid var(--line); border-radius: 12px; font-size: 2.6rem; font-weight: bold; }
    #choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    #choices button { padding: 16px 4px; font: inherit; font-size: 1.05rem; font-weight: bold; border: 2px solid var(--line); border-radius: 10px; color: #111; cursor: pointer; touch-action: manipulation; }
    #choices button:disabled { opacity: .45; cursor: default; }
    #msg { min-height: 1.6em; margin: 12px 0 0; font-size: 1.1rem; }
    #best { color: var(--muted); margin: 4px 0 0; }
    #start { margin-top: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Tebak Warna</h1>
    <p>Pilih <b>warna tulisan</b>, bukan arti katanya. 30 detik.</p>
    <div id="info"><span id="time">Waktu: 30</span><span id="score">Skor: 0</span></div>
    <div id="word" aria-live="off">?</div>
    <div id="choices" role="group" aria-label="Pilihan warna"></div>
    <p id="msg" aria-live="polite"></p>
    <p id="best"></p>
    <button class="g-btn" id="start" type="button">Mulai</button>
  </main>
  <script src="../../js/game-storage.js"></script>
  <script src="../../js/game-loader.js"></script>
</body>
</html>
