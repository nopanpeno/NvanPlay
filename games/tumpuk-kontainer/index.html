<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tumpuk Kontainer</title>
  <link rel="stylesheet" href="../../css/game.css">
  <script src="../../js/game-theme.js"></script>
  <style>
    main { max-width: 380px; padding: 18px; }
    h1 { font-size: 1.6rem; }
    #info { display: flex; justify-content: space-between; margin: 14px 0; font-size: 1.1rem; font-weight: 700; }
    #field { display: block; width: 100%; height: auto; border: 3px solid var(--line); border-radius: 16px; background: var(--surface); touch-action: none; user-select: none; }
    #msg { min-height: 1.6em; margin: 12px 0 0; }
    #best { min-height: 1.4em; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Tumpuk Kontainer</h1>
    <p>Ketuk untuk menjatuhkan kontainer. Tumpuk setinggi mungkin, jangan sampai meleset.</p>
    <div id="info"><span id="score">Skor: 0</span></div>
    <canvas id="field" width="340" height="440" aria-label="Lapangan tumpukan"></canvas>
    <p id="msg" aria-live="polite"></p>
    <p id="best"></p>
    <button class="g-btn" id="start" type="button">Mulai</button>
  </main>
  <script src="../../js/game-storage.js"></script>
  <script src="../../js/game-loader.js"></script>
</body>
</html>
