<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f1ff"><title>Pecah Balok</title><link rel="stylesheet" href="../../css/game.css"><script src="../../js/game-theme.js"></script><style>
body{display:block;padding:16px;font:16px/1.5 system-ui,sans-serif}main{max-width:620px;margin:auto;text-align:left}h1{font-size:clamp(1.7rem,7vw,2.3rem)}.intro{color:var(--muted);margin:4px 0 16px}.panel{padding:16px;border:2px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:4px 4px 0 var(--line)}.stats{display:flex;justify-content:space-between;gap:8px;margin:0 0 10px;font-weight:800}.arena{display:block;width:100%;height:auto;border:2px solid var(--line);border-radius:12px;background:#101525;touch-action:none}.status{min-height:2.6em;text-align:center;font-weight:700}.actions{display:flex;justify-content:center}.actions .g-btn{min-width:160px;min-height:48px}.help{margin:12px 0 0;text-align:center;color:var(--muted);font-size:.9rem}@media(max-width:400px){body{padding:10px}.panel{padding:11px}}
</style></head><body><main><h1>Pecah Balok</h1><p class="intro">Pantulkan bola dan pecahkan semua balok. Jangan sampai bola jatuh tiga kali!</p><section class="panel" aria-label="Permainan Pecah Balok"><p class="stats"><span>Skor <b id="score">0</b> · Nyawa <b id="lives">3</b></span><span>Rekor <b id="best">0</b></span></p><canvas id="arena" class="arena" width="480" height="360" aria-label="Arena Pecah Balok"></canvas><p id="status" class="status" role="status" aria-live="polite">Tekan Mulai, lalu ketuk atau tekan Spasi untuk meluncurkan bola.</p><div class="actions"><button id="start" class="g-btn" type="button">Mulai / Lanjut</button></div><p class="help">Gerakkan pemukul dengan sentuhan atau mouse. Di komputer, gunakan ← → dan Spasi.</p></section></main><script src="../../js/game-storage.js"></script><script src="../../js/game-loader.js"></script></body></html>
