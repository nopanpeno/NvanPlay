<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f1ff"><title>Reversi Lokal</title><link rel="stylesheet" href="../../css/game.css"><script src="../../js/game-theme.js"></script><style>
body{display:block;padding:14px;font:16px/1.5 system-ui,sans-serif}main{max-width:560px;margin:auto;text-align:left}h1{font-size:clamp(1.7rem,7vw,2.3rem)}.intro{margin:4px 0 12px;color:var(--muted)}.panel{padding:14px;border:2px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:4px 4px 0 var(--line)}.score{display:flex;justify-content:space-between;gap:10px;margin:0 0 10px;font-size:1.05rem;font-weight:800}.score span{display:flex;align-items:center;gap:7px}.disc{display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-radius:50%}.disc.black{background:#17151d}.disc.white{background:#fff}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;width:min(100%,480px);margin:10px auto;padding:3px;border:2px solid var(--line);background:#19583c}.square{position:relative;display:grid;place-items:center;min-width:0;aspect-ratio:1;padding:0;border:0;background:#39895f;cursor:pointer;touch-action:manipulation}.square:nth-child(odd){background:#348257}.square:disabled{cursor:default}.piece{width:78%;height:78%;border:2px solid #17151d;border-radius:50%;box-shadow:1px 2px 2px #0006}.piece.black{background:#17151d}.piece.white{background:#fff}.square.legal::after{position:absolute;width:20%;height:20%;border-radius:50%;background:#fff9;content:""}.square.legal:focus-visible::after{display:none}.status{min-height:3em;margin:12px 0;text-align:center;font-weight:750}.actions{display:flex;justify-content:center}.actions .g-btn{min-height:46px}@media(max-width:380px){body{padding:9px}.panel{padding:9px}.board{gap:1px}.score{font-size:.94rem}.disc{width:15px;height:15px}}
</style></head><body><main><h1>Reversi Lokal</h1><p class="intro">Dua pemain, satu layar. Balik bidak lawan dan kuasai papan dengan warna terbanyak.</p><section class="panel" aria-label="Permainan Reversi Lokal"><p class="score"><span><i class="disc black" aria-hidden="true"></i> Hitam <b id="black-count">2</b></span><span><i class="disc white" aria-hidden="true"></i> Putih <b id="white-count">2</b></span></p><div id="board" class="board" role="grid" aria-label="Papan Reversi"></div><p id="status" class="status" role="status" aria-live="polite"></p><div class="actions"><button id="reset" class="g-btn" type="button">Mulai ulang</button></div></section></main><script src="../../js/game-storage.js"></script><script src="../../js/game-loader.js"></script></body></html>
