<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f1ff"><title>Puzzle Geser</title><link rel="stylesheet" href="../../css/game.css"><script src="../../js/game-theme.js"></script><style>
body{display:block;padding:16px;font:16px/1.5 system-ui,sans-serif}main{max-width:480px;margin:auto;text-align:left}h1{font-size:clamp(1.7rem,7vw,2.3rem)}.intro{margin:4px 0 14px;color:var(--muted)}.panel{padding:16px;border:2px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:4px 4px 0 var(--line)}.stats{display:flex;justify-content:space-between;font-weight:800}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-width:360px;margin:16px auto}.tile{aspect-ratio:1;border:2px solid var(--line);border-radius:10px;background:var(--accent);color:var(--on-accent);font:800 clamp(1.4rem,8vw,2.1rem) system-ui;box-shadow:3px 3px 0 var(--line);cursor:pointer;touch-action:manipulation}.tile:disabled{background:transparent;border-color:transparent;box-shadow:none;cursor:default}.status{min-height:3em;text-align:center;font-weight:700}.actions{display:flex;justify-content:center}.actions .g-btn{min-height:48px}@media(max-width:380px){body{padding:10px}.panel{padding:12px}.board{gap:5px}.tile{border-radius:7px}}
</style></head><body><main><h1>Puzzle Geser</h1><p class="intro">Susun keping angka dari 1 sampai 15. Geser keping ke ruang kosong sampai urut.</p><section class="panel" aria-label="Permainan Puzzle Geser"><div class="stats"><span>Langkah: <b id="moves">0</b></span><span>Target: 1 → 15</span></div><div id="board" class="board" role="grid" aria-label="Papan puzzle 4 kali 4"></div><p id="status" class="status" role="status" aria-live="polite">Ketuk keping di sebelah ruang kosong.</p><div class="actions"><button id="shuffle" class="g-btn" type="button">Acak ulang</button></div><p class="intro">Di komputer, gunakan tombol panah untuk menggeser ruang kosong.</p></section></main><script src="../../js/game-storage.js"></script><script src="../../js/game-loader.js"></script></body></html>
