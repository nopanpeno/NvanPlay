<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reaksi</title>
  <link rel="stylesheet" href="../../css/game.css">
  <script src="../../js/game-theme.js"></script>
  <style>
    #pad { display: grid; place-items: center; width: 100%; min-height: 45vh; margin: 12px 0; padding: 16px; border: 2px solid var(--line); border-radius: 20px; color: var(--on-accent); cursor: pointer; font: inherit; font-size: 1.5rem; font-weight: bold; line-height: 1.3; touch-action: manipulation; -webkit-user-select: none; user-select: none; background: var(--accent); }
    #pad small { display: block; margin-top: 8px; font-size: 1rem; font-weight: normal; }
    #pad[data-state="wait"] { background: #c62828; color: #fff; }
    #pad[data-state="go"] { background: #1f7a3f; color: #fff; }
    #pad[data-state="early"] { background: #b45309; color: #fff; }
    #stats { display: flex; justify-content: space-between; color: var(--muted); }
    #msg { min-height: 1.5em; margin: 8px 0 0; }
  </style>
</head>
<body>
  <main>
    <h1>Reaksi</h1>
    <p>Tunggu layar jadi hijau, lalu ketuk secepat mungkin.</p>
    <button id="pad" type="button" data-state="idle"><span id="pad-text">Ketuk untuk mulai</span></button>
    <div id="stats"><span id="avg">Rata-rata: -</span><span id="best"></span></div>
    <p id="msg" aria-live="polite"></p>
  </main>
  <script src="../../js/game-storage.js"></script>
  <script src="../../js/game-loader.js"></script>
</body>
</html>
