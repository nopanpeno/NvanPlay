<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reaksi</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, sans-serif; background: #fafaf7; color: #1c1c1a;
    }
    main { width: 100%; max-width: 360px; padding: 16px; text-align: center; }
    h1 { margin: 0 0 4px; font-size: 1.4rem; }
    #pad {
      display: grid; place-items: center; width: 100%; min-height: 45vh; margin: 12px 0;
      padding: 16px; border: 0; border-radius: 20px; color: #fff; cursor: pointer;
      font: inherit; font-size: 1.5rem; font-weight: bold; line-height: 1.3;
      touch-action: manipulation; -webkit-user-select: none; user-select: none;
      background: #1a56c8;
    }
    #pad small { display: block; margin-top: 8px; font-size: 1rem; font-weight: normal; }
    #pad[data-state="wait"] { background: #c62828; }
    #pad[data-state="go"] { background: #1f7a3f; }
    #pad[data-state="early"] { background: #b45309; }
    #stats { display: flex; justify-content: space-between; color: #55554f; }
    #msg { min-height: 1.5em; margin: 8px 0 0; }
  </style>
</head>
<body>
  <main>
    <h1>Reaksi</h1>
    <p>Tunggu layar jadi hijau, lalu ketuk secepat mungkin.</p>
    <button id="pad" type="button" data-state="idle"><span id="pad-text">Ketuk untuk mulai</span></button>
    <div id="stats"><span id="avg">Rata-rata: -</span><span id="best"></span></div>
    <p id="msg" aria-live="polite"></p>
  </main>
  <script src="../../js/game-storage.js"></script>
  <script src="../../js/game-loader.js"></script>
</body>
</html>
