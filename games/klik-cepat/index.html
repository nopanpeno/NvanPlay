<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klik Cepat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, sans-serif; background: #fafaf7; color: #1c1c1a;
      -webkit-user-select: none; user-select: none;
    }
    main { width: 100%; max-width: 360px; padding: 16px; text-align: center; }
    h1 { margin: 0 0 4px; font-size: 1.4rem; }
    #info { display: flex; justify-content: space-between; margin: 12px 0; font-size: 1.1rem; }
    #tap {
      width: 100%; aspect-ratio: 1; max-height: 50vh; font-size: 1.6rem; font-weight: bold;
      border: 0; border-radius: 20px; background: #1a56c8; color: #fff; cursor: pointer;
      touch-action: manipulation;
    }
    #tap:active { background: #12409a; }
    #tap:disabled { background: #8a8a85; cursor: default; }
    #msg { min-height: 1.6em; margin: 12px 0 0; font-size: 1.05rem; }
    #best { color: #55554f; margin: 4px 0 0; }
    #again { margin-top: 8px; font-size: 1rem; padding: 12px 16px; border: 0; border-radius: 8px; background: #1c1c1a; color: #fff; cursor: pointer; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Klik Cepat</h1>
    <p>Ketuk sebanyak mungkin dalam 10 detik.</p>
    <div id="info"><span id="time">Waktu: 10,0</span><span id="count">Ketukan: 0</span></div>
    <button id="tap" type="button">Mulai!</button>
    <p id="msg" aria-live="polite"></p>
    <p id="best"></p>
    <button id="again" type="button" hidden>Main lagi</button>
  </main>
  <script src="../../js/game-storage.js"></script>
  <script src="../../js/game-loader.js"></script>
</body>
</html>
