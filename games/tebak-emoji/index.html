<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f1ff"><title>Tebak Emoji</title><link rel="stylesheet" href="../../css/game.css"><script src="../../js/game-theme.js"></script><style>
body{display:block;padding:16px;font:16px/1.5 system-ui,sans-serif}main{max-width:620px;margin:auto;text-align:left}h1{font-size:clamp(1.7rem,7vw,2.3rem)}.intro{color:var(--muted);margin:4px 0 16px}.panel{padding:18px;border:2px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:4px 4px 0 var(--line)}.stats{display:flex;justify-content:space-between;gap:12px;font-weight:750}.clue{margin:18px 0 6px;text-align:center;font-size:clamp(3rem,16vw,6rem);line-height:1.3;letter-spacing:.06em}.hint{text-align:center;color:var(--muted);margin:0 0 18px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{min-height:52px;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--hover);color:var(--fg);font:inherit;font-weight:750;cursor:pointer;touch-action:manipulation}.choice:disabled{cursor:default;opacity:.78}.choice.correct{background:var(--good);color:#fff}.choice.wrong{background:var(--bad);color:#fff}.status{min-height:3em;margin:14px 0 4px;font-weight:700}.actions{display:flex;gap:10px}.actions .g-btn{flex:1;min-height:48px}.best{color:var(--muted);font-size:.9rem}@media(max-width:390px){body{padding:10px}.panel{padding:13px}.choices{gap:8px}.choice{padding:8px 5px;font-size:.94rem}}
</style></head><body><main><h1>Tebak Emoji</h1><p class="intro">Tebak kata atau ungkapan dari rangkaian emoji. Jawab benar untuk lanjut dan kumpulkan skor tertinggi.</p><section class="panel" aria-label="Permainan Tebak Emoji"><div class="stats"><span id="progress">Soal 1/10</span><span>Skor: <span id="score">0</span></span></div><div id="clue" class="clue" aria-label="Petunjuk emoji"></div><p id="hint" class="hint"></p><div id="choices" class="choices"></div><p id="status" class="status" role="status" aria-live="polite">Pilih jawaban yang paling cocok.</p><div class="actions"><button id="next" class="g-btn" type="button" hidden>Lanjut</button><button id="restart" class="g-btn" type="button" hidden>Main lagi</button></div><p class="best">Rekor terbaik: <span id="best">0</span></p></section></main><script src="../../js/game-storage.js"></script><script src="../../js/game-loader.js"></script></body></html>
