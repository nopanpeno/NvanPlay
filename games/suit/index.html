<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suit</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, sans-serif; background: #fafaf7; color: #1c1c1a;
    }
    main { width: 100%; max-width: 360px; padding: 16px; text-align: center; }
    h1 { margin: 0 0 4px; font-size: 1.4rem; }
    #versus { display: flex; justify-content: space-around; margin: 16px 0 8px; min-height: 5.5rem; }
    .side { flex: 1; }
    .side small { display: block; color: #55554f; }
    .pick { display: block; font-size: 2.6rem; line-height: 1.3; }
    .pick-name { font-weight: bold; }
    #msg { min-height: 1.6em; margin: 0 0 12px; font-size: 1.2rem; font-weight: bold; }
    #choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    #choices button {
      padding: 12px 4px; font: inherit; font-size: .95rem; border: 0; border-radius: 10px;
      background: #1a56c8; color: #fff; cursor: pointer; touch-action: manipulation;
    }
    #choices button span { display: block; font-size: 1.8rem; }
    #stats { display: flex; justify-content: space-between; margin: 16px 0 0; color: #55554f; font-size: .95rem; }
    #best { margin: 4px 0 0; color: #55554f; }
  </style>
</head>
<body>
  <main>
    <h1>Suit</h1>
    <p>Lawan komputer. Menang berturut-turut untuk rekor.</p>
    <div id="versus">
      <div class="side"><small>Kamu</small><span class="pick" id="you">?</span><span class="pick-name" id="you-name"></span></div>
      <div class="side"><small>Komputer</small><span class="pick" id="cpu">?</span><span class="pick-name" id="cpu-name"></span></div>
    </div>
    <p id="msg" aria-live="polite">Pilih satu.</p>
    <div id="choices" role="group" aria-label="Pilihan"></div>
    <div id="stats"><span id="score">Menang 0 · Seri 0 · Kalah 0</span><span id="streak">Beruntun: 0</span></div>
    <p id="best"></p>
  </main>
  <script src="../../js/game-storage.js"></script>
  <script src="../../js/game-loader.js"></script>
</body>
</html>
