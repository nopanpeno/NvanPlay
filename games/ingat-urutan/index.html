<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingat Urutan</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f7f3ff; color: #211a35; }
    main { width: 100%; max-width: 380px; padding: 18px; text-align: center; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    #info { display: flex; justify-content: space-between; margin: 12px 0; font-weight: 700; }
    #board { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .pad { min-height: 115px; border: 3px solid #211a35; border-radius: 18px; opacity: .78; cursor: pointer; touch-action: manipulation; transition: opacity .12s, transform .12s, filter .12s; }
    .pad:disabled { cursor: default; }
    .pad.lit { opacity: 1; transform: scale(.96); filter: brightness(1.35); }
    .red { background: #f05252; }
    .blue { background: #4285f4; }
    .green { background: #39a96b; }
    .yellow { background: #f5c842; }
    #message { min-height: 1.6em; margin: 12px 0 4px; font-weight: 600; }
    #best { min-height: 1.4em; color: #625b70; }
    #start { margin-top: 6px; padding: 12px 22px; border: 2px solid #211a35; border-radius: 10px; background: #8b5cf6; color: white; font: inherit; font-weight: 700; cursor: pointer; touch-action: manipulation; }
    [hidden] { display: none; }
    @media (prefers-reduced-motion: reduce) { .pad { transition: none; } }
  </style>
</head>
<body>
  <main>
    <h1>Ingat Urutan</h1>
    <p>Perhatikan warna yang menyala, lalu ulangi urutannya.</p>
    <div id="info"><span id="level">Level: 1</span><span id="best"></span></div>
    <div id="board" role="group" aria-label="Tombol warna">
      <button class="pad red" type="button" aria-label="Merah"></button>
      <button class="pad blue" type="button" aria-label="Biru"></button>
      <button class="pad green" type="button" aria-label="Hijau"></button>
      <button class="pad yellow" type="button" aria-label="Kuning"></button>
    </div>
    <p id="message" aria-live="polite">Tekan Mulai untuk bermain.</p>
    <button id="start" type="button">Mulai</button>
  </main>
  <script src="../../js/game-storage.js"></script>
  <script src="../../js/game-loader.js"></script>
</body>
</html>
